name: Submission static check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

concurrency:
  group: submission-static-${{ github.event.pull_request.number }}
  # Serialize status writers for one PR; the next run reads current metadata.
  cancel-in-progress: false

jobs:
  pending:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      trusted_sha: ${{ steps.trusted.outputs.sha }}
      head_sha: ${{ steps.pending.outputs.head_sha }}
      fingerprint: ${{ steps.pending.outputs.fingerprint }}
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Capture trusted revision
        id: trusted
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Publish pending status
        id: pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -m tools.submission_check.report pending --pr-number "$PR_NUMBER" --state-file .ci-state/state.json
      - name: Upload captured state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: submission-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-state/state.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  validate:
    timeout-minutes: 15
    needs: pending
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out captured trusted revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.pending.outputs.trusted_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned runtime
        run: python -m pip install --index-url https://pypi.org/simple --require-hashes -r .ci/requirements.txt
      - name: Validate captured submission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ needs.pending.outputs.head_sha }}
          FINGERPRINT: ${{ needs.pending.outputs.fingerprint }}
        run: |
          mkdir -p .ci-result
          python -m tools.submission_check ci --pr-number "$PR_NUMBER" --expected-head-sha "$HEAD_SHA" --expected-fingerprint "$FINGERPRINT" --output .ci-result/result.json
      - name: Upload validation result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: submission-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-result/result.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 1

  report:
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [pending, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out captured trusted revision
        if: ${{ needs.pending.result == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.pending.outputs.trusted_sha }}
          persist-credentials: false
      - name: Download captured state
        if: ${{ needs.pending.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: submission-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-state
      - name: Download validation result if available
        if: ${{ needs.pending.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: submission-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-result
      - name: Publish final status
        if: ${{ always() && needs.pending.result == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VALIDATION_OUTCOME: ${{ needs.validate.result }}
        run: python3 -m tools.submission_check.report finish --pr-number "$PR_NUMBER" --state-file .ci-state/state.json --result-file .ci-result/result.json --validation-outcome "$VALIDATION_OUTCOME"
      - name: Fail when pending could not be established
        if: ${{ always() && needs.pending.result != 'success' }}
        run: exit 1

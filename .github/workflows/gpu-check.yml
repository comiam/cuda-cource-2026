name: GPU — корректность лабораторной

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

env:
  CI_TRUSTED_SHA: ${{ github.workflow_sha }}
  PYTHONPATH: ${{ github.workspace }}/lab-runner
  PYTHONSAFEPATH: "1"

concurrency:
  group: submission-gpu-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Допуск и проверка изменений
    if: ${{ github.ref_protected && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.GPU_CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/ubuntu:24.04@sha256:77eb101c607d6e3d4f5ad0c8a02c2136c689b98aba1f359e6502ba517e5c57ec
      options: --cap-add=NET_ADMIN
    defaults:
      run:
        shell: bash
    env:
      CI_EGRESS_ISOLATED_RUNNER: "1"
      CI_EGRESS_JOB_CONTAINER: "1"
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    outputs:
      trusted_sha: ${{ steps.trusted.outputs.sha }}
      ready: ${{ steps.prepare.outputs.ready }}
    steps:
      - name: Доверенный bootstrap контейнера до checkout и guard
        shell: sh
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git python3 python3-venv nftables sudo libstdc++6
      - &course_checkout
        name: Загрузка доверенного коммита курса
        id: course_checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: course
          persist-credentials: false
      - &runner_pin
        name: Проверка коммита курса и SHA раннера
        id: runner_pin
        run: |
          [[ $(git -C course rev-parse HEAD) == "$CI_TRUSTED_SHA" ]]
          lock=course/.github/lab-runner.lock
          [[ -f "$lock" && ! -L "$lock" && $(wc -c < "$lock") -eq 41 ]]
          IFS= read -r sha < "$lock"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - &runner_checkout
        name: Загрузка закреплённого приватного раннера
        id: runner_checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: comiam/cuda-cource-lab-runner
          ref: ${{ steps.runner_pin.outputs.sha }}
          path: lab-runner
          token: ${{ secrets.LAB_RUNNER_READ_TOKEN }}
          persist-credentials: false
      - &verify_runner
        name: Проверка загруженного коммита раннера
        id: verify_runner
        env:
          EXPECTED_RUNNER_SHA: ${{ steps.runner_pin.outputs.sha }}
        run: '[[ $(git -C lab-runner rev-parse HEAD) == "$EXPECTED_RUNNER_SHA" ]]'
      - name: Закрытие исходящей сети
        id: network
        env:
          CI_EGRESS_ALLOWED_ENDPOINTS: ${{ vars.CI_EGRESS_ALLOWED_ENDPOINTS }}
        run: python3 -m tools.ci_network start --directory .ci-network
      - name: Снимок сдачи и неизменяемые данные восстановления
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GPU_RUNTIME: ${{ vars.GPU_CI_RUNTIME_REVISION }}
        run: >-
          python3 -m tools.gpu_check prepare --seed-only
          --pr-number "$PR_NUMBER" --event-file "$GITHUB_EVENT_PATH"
          --runtime-revision "$GPU_RUNTIME"
          --request-file .ci-gpu/request.json --state-file .ci-gpu/state.json
      - name: Сохранение seed до pending
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpu-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-gpu/state.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Публикация принадлежащего запуску pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -m tools.gpu_check pending --pr-number "$PR_NUMBER" --state-file .ci-gpu/state.json
      - name: Сохранение только исходников запроса
        if: ${{ success() && steps.prepare.outputs.ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpu-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-gpu/request.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Снятие только собственного сетевого фильтра
        if: ${{ always() && steps.verify_runner.outcome == 'success' }}
        run: python3 -m tools.ci_network stop --directory .ci-network

  run:
    name: Проверка на GPU-хосте
    needs: prepare
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/ubuntu:24.04@sha256:77eb101c607d6e3d4f5ad0c8a02c2136c689b98aba1f359e6502ba517e5c57ec
      options: --cap-add=NET_ADMIN --device=/dev/net/tun
    defaults:
      run:
        shell: bash
    env:
      CI_EGRESS_ISOLATED_RUNNER: "1"
      CI_EGRESS_JOB_CONTAINER: "1"
    timeout-minutes: 160
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Доверенный bootstrap контейнера до checkout и guard
        shell: sh
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git python3 python3-venv nftables sudo libstdc++6 openvpn openssh-client iproute2
      - *course_checkout
      - *runner_pin
      - *runner_checkout
      - *verify_runner
      - name: Только безопасные метаданные доверенного профиля соединения
        id: connection
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          OPEN_VPN_CONFIG: ${{ secrets.OPEN_VPN_CONFIG }}
        run: python3 -m tools.gpu_check.connection >> "$GITHUB_OUTPUT"
      - name: Закрытие сети перед artifact и подключением VPN
        id: network
        shell: bash
        env:
          CI_EGRESS_ALLOWED_ENDPOINTS: ${{ vars.CI_EGRESS_ALLOWED_ENDPOINTS }}
          SSH_ADDRESS: ${{ steps.connection.outputs.ssh_host }}
          VPN_ENDPOINT: ${{ steps.connection.outputs.vpn_endpoint }}
        run: |
          python3 -m tools.ci_network start --directory .ci-network --vpn-endpoint "$VPN_ENDPOINT" --ssh-host "$SSH_ADDRESS"
      - name: Проверка происхождения запроса
        id: request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m tools.submission_check.artifacts --kind gpu-request
      - name: Загрузка запроса с исходниками
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.request.outputs.artifact_id }}
          path: .ci-gpu
          merge-multiple: true
      - name: Проверка обязательного OpenVPN и соединение
        shell: bash
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          OPEN_VPN_CONFIG: ${{ secrets.OPEN_VPN_CONFIG }}
          OPEN_VPN_SECRET: ${{ secrets.OPEN_VPN_SECRET }}
        run: |
          test -n "$OPEN_VPN_CONFIG" || { echo '::error::Для GPU CI требуется OPEN_VPN_CONFIG.'; exit 1; }
          test -n "$SSH_HOST" || { echo '::error::Для GPU CI требуется SSH_HOST.'; exit 1; }
          python3 -m tools.gpu_check.vpn start --directory .ci-vpn --target "$SSH_HOST"
      - name: Передача запроса ограниченному SSH-приёмнику
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          OPEN_VPN_CONFIG: ${{ secrets.OPEN_VPN_CONFIG }}
        run: python3 -m tools.gpu_check run --request-file .ci-gpu/request.json --result-file .ci-gpu/result.json --timeout 9120
      - name: Отключение только собственного VPN
        if: ${{ always() && steps.verify_runner.outcome == 'success' }}
        run: python3 -m tools.gpu_check.vpn stop --directory .ci-vpn
      - name: Сохранение публичного результата без runtime-логов
        if: ${{ always() && steps.network.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpu-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-gpu/result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1
      - name: Снятие только собственного сетевого фильтра
        if: ${{ always() && steps.verify_runner.outcome == 'success' }}
        run: python3 -m tools.ci_network stop --directory .ci-network

  report:
    name: Публикация результата GPU
    needs: [prepare, run]
    if: ${{ always() && github.ref_protected && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.GPU_CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/ubuntu:24.04@sha256:77eb101c607d6e3d4f5ad0c8a02c2136c689b98aba1f359e6502ba517e5c57ec
      options: --cap-add=NET_ADMIN
    defaults:
      run:
        shell: bash
    env:
      CI_EGRESS_ISOLATED_RUNNER: "1"
      CI_EGRESS_JOB_CONTAINER: "1"
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      statuses: write
    steps:
      - name: Доверенный bootstrap контейнера до checkout и guard
        shell: sh
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git python3 python3-venv nftables sudo libstdc++6
      - *course_checkout
      - *runner_pin
      - *runner_checkout
      - *verify_runner
      - name: Закрытие исходящей сети
        id: network
        env:
          CI_EGRESS_ALLOWED_ENDPOINTS: ${{ vars.CI_EGRESS_ALLOWED_ENDPOINTS }}
        run: python3 -m tools.ci_network start --directory .ci-network
      - name: Проверка происхождения seed и результата
        id: artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m tools.submission_check.artifacts --kinds gpu-state gpu-result --required-kind gpu-state
      - name: Загрузка владельца статуса
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.artifacts.outputs.gpu_state_artifact_id }}
          path: .ci-gpu
          merge-multiple: true
      - name: Загрузка публичного результата
        if: ${{ steps.artifacts.outputs.gpu_result_artifact_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.artifacts.outputs.gpu_result_artifact_id }}
          path: .ci-gpu
          merge-multiple: true
      - name: Завершение только собственного статуса PR
        if: ${{ always() && steps.network.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_OUTCOME: ${{ steps.artifacts.outputs.gpu_result_outcome || needs.run.result }}
        run: >-
          python3 -m tools.gpu_check report --pr-number "$PR_NUMBER"
          --state-file .ci-gpu/state.json --result-file .ci-gpu/result.json
          --run-outcome "$RUN_OUTCOME"
      - name: Снятие только собственного сетевого фильтра
        if: ${{ always() && steps.verify_runner.outcome == 'success' }}
        run: python3 -m tools.ci_network stop --directory .ci-network
